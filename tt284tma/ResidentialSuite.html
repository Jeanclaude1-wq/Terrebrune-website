<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrebrune Hotel - Catalog</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body
        {
            
        }
        /* Additional CSS for hiding slides initially */
        .slide {
            display: none;
        }

        /* Display first slide initially */
        .slide:first-child {
            display: block;
        }

        /* Adjustments for carousel layout */
        .gallery {
            object-fit: contain;
            position: relative;
            width: 100%;
            height: 100vh; /* Make the gallery full-screen */
            overflow: hidden;
        }

        .gallery img {
            width: auto;
            height: 100%;
            object-fit: contain; /* Ensure entire image is visible */
            display: block;
            margin: 0 auto; /* Center images horizontally */
        }

        .navigation {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .navigation button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .navigation button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="menu">
        <div class="logo"><img src="logo.jpg" alt="logo"></div>
    </div>

    <div class="gallery">
        <div class="slide" id="slide1"><img src="residentialsuite1.jpg" alt="residentialsuite1"></div>
        <div class="slide" id="slide2"><img src="residentialsuite2.jpg" alt="residentialsuite2"></div>
        <div class="slide" id="slide3"><img src="residentialsuite3.jpg" alt="residentialsuite3"></div>
        <div class="slide" id="slide4"><img src="residentialsuite4.jpg" alt="residentialsuite4"></div>
        <div class="slide" id="slide5"><img src="residentialsuite5.jpg" alt="residentialsuite5"></div>
        <div class="slide" id="slide5"><img src="residentialsuite6.jpg" alt="residentialsuite6"></div>
        <div class="slide" id="slide5"><img src="residentialsuite7.jpg" alt="residentialsuite7"></div>


    </div>

    <div class="navigation">
        <button id="prevButton">Previous</button>
        <button id="nextButton">Next</button>
    </div>

    <script>
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const slides = document.getElementsByClassName("slide");
        let currentSlide = 0;

        prevButton.addEventListener("click", () => {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlides();
        });

        nextButton.addEventListener("click", () => {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlides();
        });

        function updateSlides() {
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slides[currentSlide].style.display = "block";
        }

        // Initially, hide all slides except the first one
        updateSlides();
    </script>
</body>
</html>
