    <script>
        function calculatePrice() {
            // Get selected room category
            var roomCategory = document.getElementById("roomCategory").value;
            
            // Get number of nights
            var checkInDate = new Date(document.getElementsByName("check_in")[0].value);
            var checkOutDate = new Date(document.getElementsByName("check_out")[0].value);
            var numberOfNights = (checkOutDate - checkInDate) / (1000 * 60 * 60 * 24);

            // Define price per night for each room category
            var prices = {
                "option_value1": 200, // Delux room
                "option_value2": 250, // Excecutive room
                "option_value3": 330, // Majestic room
                "option_value4": 350, // Captain Suite
                "option_value5": 500, // Terrebrune Suite
                "option_value6": 1200  // Residential Suite
            };

            // Calculate total price
            var totalPrice = prices[roomCategory] * numberOfNights;

            // Display total price
            alert("Total Price: $" + totalPrice);
        }
    

    </script>
